# Release pipeline: build the installer and publish it to GitHub Releases.
#
# Runs when a `v*` tag is pushed (e.g. `git tag v0.2.0; git push --tags`).
# tauri-action builds the bundle, signs it with the key held in repository
# secrets and attaches `latest.json` - the file the running app asks for when
# it checks for updates.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # A cold Rust build takes upwards of ten minutes; the cache brings later
      # releases down to a couple.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: lotusMail ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
